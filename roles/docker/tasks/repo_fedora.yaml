---
- name: Ensure old versions of Docker are not installed.
  become: true
  package:
    name:
      - docker
      - docker-common
      - docker-engine
      - docker-ce-rootless-extras
      - docker-ce-cli
      - docker-ce
      - docker-compose-plugin
    state: absent

# Fedora provides podman in main repos; no 3rd-party Docker CE repo required.
