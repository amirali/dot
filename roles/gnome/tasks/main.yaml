- name: Install GNOME packages on Fedora
  become: true
  ansible.builtin.package:
    name: "{{ gnome_packages_fedora }}"
    state: present

- name: Ensure Nordic theme is cloned into user's .themes
  ansible.builtin.git:
    repo: "{{ nordic_repo }}"
    dest: "{{ ansible_env.HOME }}/.themes/Nordic"
    depth: 1
    update: yes
  become: false

- name: Ensure ~/.icons exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.icons"
    state: directory
    mode: '0755'
  become: false

- name: Find Nordic icon directories
  ansible.builtin.find:
    paths: "{{ ansible_env.HOME }}/.themes/Nordic/icons"
    file_type: directory
    depth: 2
  register: nordic_icon_dirs
  ignore_errors: true
  become: false

- name: Copy each Nordic icon directory into ~/.icons
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: yes
  loop: "{{ nordic_icon_dirs.files | default([]) }}"
  when: nordic_icon_dirs is defined and nordic_icon_dirs.matched > 0
  become: false

- name: Set GTK and icon theme via gsettings
  ansible.builtin.command:
    cmd: |
      gsettings set org.gnome.desktop.interface gtk-theme "Nordic" || true
      gsettings set org.gnome.desktop.interface icon-theme "Papirus" || true
  become: false
  environment:
    XDG_RUNTIME_DIR: "{{ ansible_env.XDG_RUNTIME_DIR | default(ansible_env.HOME + '/.cache') }}"
  ignore_errors: true

- name: Configure GNOME keyboard shortcuts
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value | string }}"
    state: present
  loop: "{{ gnome_keybindings }}"
  loop_control:
    label: "{{ item.key }}"
  become: false
  tags:
    - gnome-keybindings

- name: Get GNOME Shell version
  ansible.builtin.command:
    cmd: gnome-shell --version
  register: gnome_shell_version_result
  changed_when: false
  become: false

- name: List installed GNOME Shell extensions
  ansible.builtin.command:
    cmd: gnome-extensions list
  register: installed_gnome_extensions
  changed_when: false
  become: false

- name: Determine missing GNOME Shell extensions
  ansible.builtin.set_fact:
    gnome_shell_version: >-
      {{ gnome_shell_version_result.stdout
         | regex_replace('^GNOME Shell\s+', '') }}
    missing_gnome_extensions: >-
      {{ gnome_shell_extensions
         | difference(installed_gnome_extensions.stdout_lines) }}

- name: Install missing GNOME Shell extensions
  when: missing_gnome_extensions | length > 0
  block:
    - name: Create temporary GNOME extension directory
      ansible.builtin.tempfile:
        state: directory
        suffix: gnome-extensions
      register: gnome_extension_tempdir

    - name: Resolve compatible GNOME Shell extensions
      ansible.builtin.uri:
        url: >-
          https://extensions.gnome.org/extension-info/?uuid={{ item | urlencode
          }}&shell_version={{ gnome_shell_version | urlencode }}
        return_content: true
      loop: "{{ missing_gnome_extensions }}"
      loop_control:
        label: "{{ item }}"
      register: gnome_extension_metadata

    - name: Verify GNOME Shell extension compatibility
      ansible.builtin.assert:
        that:
          - item.json.download_url is defined
        fail_msg: >-
          No compatible release of {{ item.item }} was found for GNOME Shell
          {{ gnome_shell_version }}.
      loop: "{{ gnome_extension_metadata.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Download GNOME Shell extensions
      ansible.builtin.get_url:
        url: "https://extensions.gnome.org{{ item.json.download_url }}"
        dest: "{{ gnome_extension_tempdir.path }}/{{ item.item }}.zip"
        mode: '0600'
      loop: "{{ gnome_extension_metadata.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: downloaded_gnome_extensions

    - name: Install GNOME Shell extensions
      ansible.builtin.command:
        cmd: "gnome-extensions install --force {{ item.dest }}"
      loop: "{{ downloaded_gnome_extensions.results }}"
      loop_control:
        label: "{{ item.item.item }}"
      become: false
  always:
    - name: Remove temporary GNOME extension directory
      ansible.builtin.file:
        path: "{{ gnome_extension_tempdir.path }}"
        state: absent
      when: gnome_extension_tempdir.path is defined

- name: List enabled GNOME Shell extensions
  ansible.builtin.command:
    cmd: gnome-extensions list --enabled
  register: enabled_gnome_extensions
  changed_when: false
  become: false

- name: Enable configured GNOME Shell extensions
  ansible.builtin.command:
    cmd: "gnome-extensions enable {{ item }}"
  loop: "{{ gnome_shell_extensions | difference(enabled_gnome_extensions.stdout_lines) }}"
  loop_control:
    label: "{{ item }}"
  become: false
