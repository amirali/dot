- name: Install GNOME packages on Fedora
  become: true
  ansible.builtin.package:
    name: "{{ gnome_packages_fedora }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install GNOME packages on Debian/Pop!_OS
  become: true
  ansible.builtin.package:
    name: "{{ gnome_packages_debian }}"
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install GNOME packages on Arch (pacman)
  become: true
  ansible.builtin.package:
    name: "{{ gnome_packages_arch }}"
    state: present
  when: ansible_facts['pkg_mgr'] == 'pacman'

- name: Ensure Nordic theme is cloned into user's .themes
  ansible.builtin.git:
    repo: "{{ nordic_repo }}"
    dest: "{{ ansible_env.HOME }}/.themes/Nordic"
    depth: 1
    update: yes
  become: false

- name: Ensure ~/.icons exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.icons"
    state: directory
    mode: '0755'
  become: false

- name: Find Nordic icon directories
  ansible.builtin.find:
    paths: "{{ ansible_env.HOME }}/.themes/Nordic/icons"
    file_type: directory
    depth: 2
  register: nordic_icon_dirs
  ignore_errors: true
  become: false

- name: Copy each Nordic icon directory into ~/.icons
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: yes
  loop: "{{ nordic_icon_dirs.files | default([]) }}"
  when: nordic_icon_dirs is defined and nordic_icon_dirs.matched > 0
  become: false

- name: Set GTK and icon theme via gsettings
  ansible.builtin.command:
    cmd: |
      gsettings set org.gnome.desktop.interface gtk-theme "Nordic" || true
      gsettings set org.gnome.desktop.interface icon-theme "Papirus" || true
  become: false
  environment:
    XDG_RUNTIME_DIR: "{{ ansible_env.XDG_RUNTIME_DIR | default(ansible_env.HOME + '/.cache') }}"
  ignore_errors: true

- name: Ensure custom keybinding list contains ghostty entry
  ansible.builtin.shell: |
    current=$(gsettings get org.gnome.settings-daemon.plugins.media-keys custom-keybindings || "[]")
    cb_path="/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom-ghostty/"
    if ! echo "$current" | grep -q "$cb_path"; then
      if [ "$current" = "[]" ]; then
        new="['$cb_path']"
      else
        new=$(echo "$current" | sed "s/]$/, '$cb_path']/")
      fi
      gsettings set org.gnome.settings-daemon.plugins.media-keys custom-keybindings "$new" || true
    fi
  args:
    executable: /bin/bash
  become: false
  ignore_errors: true

- name: Configure custom keybinding values for ghostty
  ansible.builtin.command:
    cmd: |
      CB="/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom-ghostty/"
      gsettings set org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:$CB name 'Ghostty' || true
      gsettings set org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:$CB command 'ghostty' || true
      gsettings set org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:$CB binding '<Control><Alt>t' || true
  become: false
  ignore_errors: true

- name: Enable configured GNOME shell extensions
  ansible.builtin.command:
    cmd: "gnome-extensions enable {{ item }}"
  loop: "{{ gnome_shell_extensions }}"
  register: enable_ext_results
  failed_when: false
  become: false
  ignore_errors: true
