- name: Install niri packages on Fedora
  become: true
  ansible.builtin.package:
    name: "{{ niri_packages_fedora }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install niri packages on Arch (pacman)
  become: true
  ansible.builtin.package:
    name: "{{ niri_packages_arch }}"
    state: present
  when: ansible_facts['pkg_mgr'] == 'pacman'

# ponytail: Debian/Pop!_OS has no packaged niri, skipping until upstream ships one.

- name: Link Niri, Sway, and shared Wayland dotfiles
  ansible.builtin.shell: |
    dest="$(eval echo {{ item.dest }})"
    src="$(eval echo {{ item.src }})"
    if [ -e "$dest" ] && [ ! -L "$dest" ]; then
      mv "$dest" "$dest.backup"
    fi
    mkdir -p "$(dirname "$dest")"
    ln -sfn "$src" "$dest"
  args:
    executable: /bin/bash
  loop: "{{ niri_dotfiles }}"
  tags:
    - link_files
