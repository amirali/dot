- name: Include Fedora package variables
  ansible.builtin.include_vars: fedora.yaml
  when: ansible_facts['os_family'] == "RedHat"

- name: Include Arch Linux package variables
  ansible.builtin.include_vars: archlinux.yaml
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install packages on Fedora
  ansible.builtin.include_tasks: install_fedora.yaml
  when: ansible_facts['os_family'] == "RedHat"

- name: Install packages on Arch Linux
  ansible.builtin.include_tasks: install_archlinux.yaml
  when: ansible_facts['os_family'] == "Archlinux"
