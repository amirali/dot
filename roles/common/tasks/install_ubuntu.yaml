- name: Install software-properties-common
  become: true
  ansible.builtin.apt:
    name: software-properties-common
    state: present
    update_cache: true

- name: Add Ghostty PPA
  become: true
  ansible.builtin.apt_repository:
    repo: ppa:mkasberg/ghostty-ubuntu
    state: present
    update_cache: false

- name: Install packages
  become: true
  ansible.builtin.apt:
    name: "{{ ubuntu_packages }}"
    state: present
    update_cache: true
