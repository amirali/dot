- name: Enable WezTerm repo
  become: true
  community.general.copr:
    name: wezfurlong/wezterm-nightly
    state: enabled

- name: Enable RPM Fusion repos
  become: true
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: true

- name: Enable Terra repo
  become: true
  ansible.builtin.command:
    cmd: >
      dnf install -y --nogpgcheck
      --repofrompath 'terra,https://repos.fyralabs.com/terra{{ ansible_distribution_major_version }}'
      terra-release
    creates: /etc/yum.repos.d/terra.repo

- name: Install packages
  become: true
  ansible.builtin.package:
    name: "{{ fedora_packages }}"
    state: present
