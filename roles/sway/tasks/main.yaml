- name: Enable RMPC COPR repository
  become: true
  ansible.builtin.command:
    cmd: dnf -y copr enable skoved/rmpc
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:skoved:rmpc.repo

- name: Install Sway desktop packages
  become: true
  ansible.builtin.package:
    name: "{{ sway_packages }}"
    state: present

- name: Enable Fedora firewall
  become: true
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Allow KDE Connect through Fedora firewall
  become: true
  ansible.posix.firewalld:
    service: kdeconnect
    permanent: true
    immediate: true
    state: enabled

- name: Enable fingerprint authentication in Fedora PAM
  become: true
  ansible.builtin.shell: |
    if ! authselect current | grep -q 'with-fingerprint'; then
      authselect enable-feature with-fingerprint
      echo enabled
    fi
  args:
    executable: /bin/bash
  register: fingerprint_auth
  changed_when: "'enabled' in fingerprint_auth.stdout_lines"

- name: Create MPD state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_env.HOME }}/.local/state/mpd"
    - "{{ ansible_env.HOME }}/.local/state/mpd/playlists"

- name: Link Sway desktop dotfiles
  ansible.builtin.shell: |
    dest="$(eval echo {{ item.dest }})"
    src="$(eval echo {{ item.src }})"
    if [ -e "$dest" ] && [ ! -L "$dest" ]; then
      mv "$dest" "$dest.backup"
    fi
    mkdir -p "$(dirname "$dest")"
    ln -sfn "$src" "$dest"
  args:
    executable: /bin/bash
  loop: "{{ sway_dotfiles }}"
  tags:
    - link_files
