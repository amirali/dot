- name: Setup new system
  hosts:
    - localhost
      # become: yes
      # become_user: root
  gather_facts: true
  pre_tasks:
    - name: Require Fedora or Arch Linux family
      ansible.builtin.assert:
        that:
          - >-
            ansible_distribution == "Fedora"
            or ansible_facts['os_family'] == "Archlinux"
        fail_msg: "This setup supports Fedora and Arch Linux family only."
  roles:
    - common
    # - docker
    # - containers
    - gnome
