- name: Setup new system
  hosts:
    - localhost
      # become: yes
      # become_user: root
  gather_facts: true
  pre_tasks:
    - name: Require Fedora or Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_distribution in ["Fedora", "Ubuntu"]
        fail_msg: "This setup supports Fedora and Ubuntu only."
  roles:
    - common
    # - docker
    # - containers
    - gnome
